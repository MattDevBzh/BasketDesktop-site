name: Build and publish macOS v0.4.0
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-macos.yml'
      - '.github/scripts/build-macos.mjs'
permissions:
  contents: read
concurrency:
  group: macos-v0.4.0
  cancel-in-progress: false
env:
  APP_VERSION: 0.4.0
jobs:
  build:
    name: macOS ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            arch: arm64
          - os: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Download verified Windows application payload
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "v${APP_VERSION}" --repo "$GITHUB_REPOSITORY" --pattern "BasketDesktop-Windows-x64-v${APP_VERSION}.zip" --dir "$RUNNER_TEMP/input"
      - name: Install packaging tools
        run: npm install --prefix "$RUNNER_TEMP/basket-tools" --ignore-scripts --no-audit --no-fund @electron/packager@20.3.0 @electron/asar@4.3.1
      - name: Package, sign locally, verify and launch on macOS
        env:
          TARGET_ARCH: ${{ matrix.arch }}
          BASKET_TOOLS: ${{ runner.temp }}/basket-tools
        run: node .github/scripts/build-macos.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: BasketDesktop-macOS-${{ matrix.arch }}-v0.4.0
          path: dist/*
          if-no-files-found: error
          retention-days: 14
  windows-check:
    name: Verify native Windows launch
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Download and verify Windows v0.4.0
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release download "v${env:APP_VERSION}" --repo "$env:GITHUB_REPOSITORY" --pattern "BasketDesktop-Windows-x64-v${env:APP_VERSION}.zip"
          $zip = "BasketDesktop-Windows-x64-v${env:APP_VERSION}.zip"
          if ((Get-FileHash $zip -Algorithm SHA256).Hash.ToLower() -ne '73f4675d5af3b55180a6813b737c366d5ae61c09ec05256e434ad4b73ceba986') { throw 'Checksum mismatch' }
          Expand-Archive $zip -DestinationPath app
          $p = Start-Process -FilePath ./app/BasketDesktop/BasketDesktop.exe -ArgumentList '--smoke-test' -PassThru -RedirectStandardOutput smoke.log -RedirectStandardError smoke-error.log
          if (-not $p.WaitForExit(60000)) { Stop-Process -Id $p.Id; throw 'Launch timed out' }
          Get-Content smoke.log
          Get-Content smoke-error.log
          if ($p.ExitCode -ne 0 -or -not (Select-String -Path smoke.log -Pattern 'SMOKE_OK' -Quiet)) { throw 'Native Windows launch failed' }
  publish:
    name: Add macOS downloads to the existing release
    needs: [build, windows-check]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: BasketDesktop-macOS-*-v0.4.0
          path: release-files
          merge-multiple: true
      - name: Publish both Mac archives and checksums
        working-directory: release-files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum BasketDesktop-macOS-*-v${APP_VERSION}.zip > "SHA256SUMS-macOS-v${APP_VERSION}.txt"
          gh release upload "v${APP_VERSION}" BasketDesktop-macOS-*-v${APP_VERSION}.zip "SHA256SUMS-macOS-v${APP_VERSION}.txt" --repo "$GITHUB_REPOSITORY" --clobber
