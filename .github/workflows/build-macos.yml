name: Build and publish macOS v0.4.1
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-macos.yml'
      - '.github/scripts/build-macos.mjs'
permissions:
  contents: read
concurrency:
  group: macos-v0.4.1
  cancel-in-progress: false
env:
  APP_VERSION: 0.4.1
  PAYLOAD_VERSION: 0.4.0
jobs:
  build:
    name: macOS ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-26
            arch: arm64
          - os: macos-26-intel
            arch: x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Download verified Windows application payload
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "v${PAYLOAD_VERSION}" --repo "$GITHUB_REPOSITORY" --pattern "BasketDesktop-Windows-x64-v${PAYLOAD_VERSION}.zip" --dir "$RUNNER_TEMP/input"
      - name: Install packaging tools
        run: npm install --prefix "$RUNNER_TEMP/basket-tools" --ignore-scripts --no-audit --no-fund @electron/packager@20.3.0 @electron/asar@4.3.1
      - name: Package, sign locally, verify and launch on macOS
        env:
          TARGET_ARCH: ${{ matrix.arch }}
          BASKET_TOOLS: ${{ runner.temp }}/basket-tools
        run: node .github/scripts/build-macos.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: BasketDesktop-macOS-${{ matrix.arch }}-v0.4.1
          path: dist/*
          if-no-files-found: error
          retention-days: 14
  publish:
    name: Publish macOS signing hotfix
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: BasketDesktop-macOS-*-v0.4.1
          path: release-files
          merge-multiple: true
      - name: Publish both Mac archives and checksums
        working-directory: release-files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum BasketDesktop-macOS-*-v${APP_VERSION}.zip > "SHA256SUMS-macOS-v${APP_VERSION}.txt"
          cat > release-notes.txt <<'NOTES'
          Correctif macOS : résout le plantage au démarrage « different Team IDs » lors du chargement d’Electron.
          Versions Apple Silicon et Intel ; signatures et démarrage vérifiés sur macOS 26, après extraction du ZIP et via LaunchServices.
          Remplacez l’ancienne application par celle de ce ZIP dans Applications.
          Version de test non notariée par Apple. Windows reste disponible en v0.4.0.
          NOTES
          gh release view "v${APP_VERSION}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create "v${APP_VERSION}" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "BasketDesktop v${APP_VERSION} — Correctif macOS" --notes-file release-notes.txt
          gh release upload "v${APP_VERSION}" BasketDesktop-macOS-*-v${APP_VERSION}.zip "SHA256SUMS-macOS-v${APP_VERSION}.txt" macos-*.json --repo "$GITHUB_REPOSITORY" --clobber
